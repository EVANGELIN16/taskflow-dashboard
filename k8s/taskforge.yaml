
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskforge-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskforge-db
  template:
    metadata:
      labels:
        app: taskforge-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: taskforge
            - name: POSTGRES_DB
              value: taskforge_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U taskforge -d taskforge_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taskforge-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: taskforge-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskforge-backend
  template:
    metadata:
      labels:
        app: taskforge-backend
    spec:
      containers:
        - name: backend
          image: host.docker.internal:5002/taskforge-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: database-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: session-secret
            - name: NODE_ENV
              value: "development"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: taskforge-backend
  ports:
    - port: 5000
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskforge-frontend
  template:
    metadata:
      labels:
        app: taskforge-frontend
    spec:
      containers:
        - name: frontend
          image: host.docker.internal:5002/taskforge-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: taskforge-frontend
spec:
  selector:
    app: taskforge-frontend
  ports:
    - port: 80
      targetPort: 80
